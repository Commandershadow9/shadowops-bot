/home/cmdshadow/shadowops-bot/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    create 0644 cmdshadow cmdshadow
    dateext
    dateformat -%Y%m%d

    postrotate
        pkill -USR1 -f "[s]hadowops-bot.*/bot\.py" 2>/dev/null || true
    endscript
}
