# Notbetrieb zerodox.de auf HEL1 (ZERODOX #5629).
# Im Normalbetrieb zeigt kein DNS-Eintrag hierher. Erst der Umschalter setzt
# `zerodox.de A` auf HEL1, wenn der Hauptserver vollständig ausgefallen ist.
#
# Daten (read-only, gespiegelt vom Hauptserver alle 5 min):
#   /srv/daten/seiten/{notseite,impressum,datenschutz}.html
#   /srv/daten/impressen/<slug>.html     Kunden-Impressen (#4262)
#   /srv/daten/tls/{fullchain,privkey}.pem  Zertifikat aus Traefik
#
# Kein Skript, keine Fremdquelle: Alle Seiten sind eigenständig, die CSP sagt das verbindlich.

server_tokens off;
# nginx-unprivileged: läuft als Benutzer notbetrieb, Docker veröffentlicht 80→8080 und 443→8443.

server {
    listen 8080 default_server;
    server_name _;
    location = /health { return 200 "ok\n"; }
    location / { return 301 https://zerodox.de$request_uri; }
}

server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /srv/daten/tls/fullchain.pem;
    ssl_certificate_key /srv/daten/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:notbetrieb:5m;
    charset utf-8;

    root /srv/daten/seiten;

    # `always` ist Pflicht, sonst fehlen die Header bei 404/503. Ein eigener
    # add_header in einem location-Block hebt die Vererbung auf, deshalb stehen
    # sie dort jeweils vollständig.
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control "no-store" always;
    add_header X-Zerodox-Notbetrieb "1" always;

    location = /impressum   { try_files /impressum.html =503; }
    location = /datenschutz { try_files /datenschutz.html =503; }

    # Kunden-Impressen: dieselbe Slug-Regel wie im Wartungscontainer (#4262), keine Traversierung.
    # Fehlt der Schnappschuss, ist das Impressum nicht öffentlich → 404, nie ein fremder Stand.
    location ~ "^/creator/([a-z0-9][a-z0-9-]{0,99})/impressum$" {
        root /srv/daten/impressen;
        try_files /$1.html =404;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Zerodox-Notbetrieb "1" always;
    }

    location = /notseite.html { internal; }

    # Alles andere (Startseite, Portal, Login, API): 503 mit der Notseite. 503 statt 200,
    # damit Suchmaschinen den Index behalten und Clients es als vorübergehend erkennen.
    error_page 503 /notseite.html;
    error_page 404 /notseite.html;
    location / {
        add_header Retry-After "600" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-Zerodox-Notbetrieb "1" always;
        return 503;
    }
}
